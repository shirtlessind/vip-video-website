<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin VIP</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .admin-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .admin-menu {
      display: flex;
      gap: 1rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 2rem;
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--primary);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group label span.required {
      color: #ef4444;
    }
    .form-group label span.optional {
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .date-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <div class="admin-header">
      <h2>Dashboard Admin VIP</h2>
      <a href="index.html" class="btn-primary-sm" style="text-decoration: none;">Ke Halaman Utama</a>
    </div>

    <!-- Navigasi Menu Tab Admin -->
    <div class="admin-menu">
      <button class="tab-btn active" onclick="switchTab('pengumuman')"><i data-lucide="megaphone"></i> Kelola Pengumuman</button>
      <button class="tab-btn" onclick="switchTab('diskon')"><i data-lucide="percent"></i> Kelola Diskon</button>
    </div>

    <!-- TAB 1: KELOLA PENGUMUMAN -->
    <div id="tab-pengumuman" class="tab-content active">
      <div class="card">
        <h3>Form Kelola Pengumuman</h3>
        <form id="formPengumuman" style="margin-top: 1.5rem;">
          
          <div class="form-group">
            <label>Upload Foto Pengumuman <span class="optional">(Opsional)</span></label>
            <input type="file" id="annImage" accept="image/*">
          </div>

          <div class="form-group">
            <label>Judul <span class="required">*</span></label>
            <input type="text" id="annTitle" placeholder="Masukkan judul pengumuman" required>
          </div>

          <div class="form-group">
            <label>Keterangan <span class="required">*</span></label>
            <textarea id="annText" rows="5" placeholder="Masukkan isi/keterangan pengumuman..." required></textarea>
          </div>

          <button type="button" onclick="simpanPengumuman()" class="btn-primary">Publish Pengumuman</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: KELOLA DISKON -->
    <div id="tab-diskon" class="tab-content">
      <div class="card">
        <h3>Form Kelola Diskon / Promo</h3>
        <form id="formDiskon" style="margin-top: 1.5rem;">

          <div class="form-group">
            <label>Kode Promo <span class="required">*</span></label>
            <input type="text" id="promoCode" placeholder="Contoh: DISKON50" style="text-transform: uppercase;" required>
          </div>

          <div class="form-group">
            <label>Rentang Promo (Tanggal Mulai s/d Selesai) <span class="required">*</span></label>
            <div class="date-range">
              <div>
                <small style="color:var(--text-muted); display:block; margin-bottom:4px;">Mulai Berlaku:</small>
                <input type="date" id="promoStartDate" required>
              </div>
              <div>
                <small style="color:var(--text-muted); display:block; margin-bottom:4px;">Berakhir On:</small>
                <input type="date" id="promoEndDate" required>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Diskon Berapa (%) <span class="required">*</span></label>
            <input type="number" id="promoDiscount" placeholder="Contoh: 50" min="1" max="100" required>
          </div>

          <button type="button" onclick="simpanDiskon()" class="btn-primary">Simpan Pengaturan Diskon</button>
        </form>
      </div>
    </div>

  </div>

  <script src="admin.js"></script>
</body>
</html>
