<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - VIP Video</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="padding: 2rem;">

  <div style="max-width: 800px; margin: 0 auto;">
    <h2>Dashboard Pengaturan Admin VIP</h2>
    <hr style="border-color:var(--border); margin: 1rem 0 2rem 0;">

    <!-- Form Tambah Pengumuman + Gambar -->
    <div class="card" style="margin-bottom: 2rem;">
      <h3>Tambah Pengumuman Baru</h3>
      <form id="adminAnnounceForm">
        <div class="form-group">
          <label>Judul Pengumuman</label>
          <input type="text" id="annTitle" required>
        </div>
        <div class="form-group">
          <label>Badge Category (Contoh: PROMO HUT RI / INFO)</label>
          <input type="text" id="annBadge" required>
        </div>
        <div class="form-group">
          <label>Upload Gambar Pengumuman</label>
          <input type="file" id="annImage" accept="image/*">
        </div>
        <div class="form-group">
          <label>Isi Pengumuman</label>
          <textarea id="annText" style="width:100%; background:var(--bg-dark); color:#fff; border:1px solid var(--border); padding:0.8rem; border-radius:8px; height:100px;" required></textarea>
        </div>
        <button type="button" onclick="saveAnnouncement()" class="btn-primary">Simpan Pengumuman</button>
      </form>
    </div>

    <!-- Form Setting Kode Promo -->
    <div class="card">
      <h3>Pengaturan Kode Promo (IDR, RM, & USD)</h3>
      <form id="adminPromoForm">
        <div class="form-group">
          <label>Kode Promo</label>
          <input type="text" id="promoCode" placeholder="Contoh: HUTRI81" required>
        </div>
        <div class="form-group">
          <label>Persentase Diskon (%)</label>
          <input type="number" id="promoDiscount" placeholder="50" min="1" max="100" required>
        </div>
        <div class="form-group">
          <label>Tanggal Mulai Berlaku</label>
          <input type="date" id="promoStartDate" required>
        </div>
        <div class="form-group">
          <label>Tanggal Berakhir Promo</label>
          <input type="date" id="promoEndDate" required>
        </div>
        <button type="button" onclick="savePromoSettings()" class="btn-primary">Simpan Pengaturan Promo</button>
      </form>
    </div>
  </div>

  <script>
    function saveAnnouncement() {
      const title = document.getElementById('annTitle').value;
      const badge = document.getElementById('annBadge').value;
      const text = document.getElementById('annText').value;
      const fileInput = document.getElementById('annImage');

      if (!title || !badge || !text) {
        alert("Semua field teks harus diisi!");
        return;
      }

      const newAnn = {
        title,
        badge,
        text,
        date: new Date().toLocaleDateString('id-ID'),
        img: fileInput.files[0] ? URL.createObjectURL(fileInput.files[0]) : ""
      };

      let currentData = JSON.parse(localStorage.getItem('vip_announcements')) || [];
      currentData.unshift(newAnn);
      localStorage.setItem('vip_announcements', JSON.stringify(currentData));
      alert("Pengumuman berhasil ditambahkan!");
    }

    function savePromoSettings() {
      const settings = {
        code: document.getElementById('promoCode').value.toUpperCase(),
        discount: document.getElementById('promoDiscount').value,
        startDate: document.getElementById('promoStartDate').value,
        endDate: document.getElementById('promoEndDate').value
      };

      localStorage.setItem('vip_promo_settings', JSON.stringify(settings));
      alert("Pengaturan Kode Promo Berhasil Disimpan!");
    }
  </script>
</body>
</html>
